let drag=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;orbit-=(e.clientX-px)*.006;pitch=clamp(pitch+(e.clientY-py)*.004,-.15,1.05);px=e.clientX;py=e.clientY});renderer.domElement.addEventListener('wheel',e=>{dist=clamp(dist+Math.sign(e.deltaY)*1.5,5,30)},{passive:true});
document.getElementById('view').onclick=e=>{mode=(mode+1)%3;e.target.textContent=['Camera: Follow','Camera: Orbit','Camera: First person'][mode]};document.getElementById('quality').onclick=e=>{renderer.shadowMap.enabled=!renderer.shadowMap.enabled;sun.castShadow=renderer.shadowMap.enabled;e.target.textContent='Shadows: '+(renderer.shadowMap.enabled?'On':'Off');scene.traverse(o=>{if(o.isMesh)o.material.needsUpdate=true})};document.getElementById('reset').onclick=()=>{player.x=0;player.z=16;player.yaw=0;orbit=0;showPlace(2)};
const clock=new T.Clock(),aim=new T.Vector3();let walkingSpeed=0;function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.05);if(keys.left)player.yaw+=dt*1.8;if(keys.right)player.yaw-=dt*1.8;let move=(keys.forward?1:0)-(keys.back?1:0);walkingSpeed+=(move-walkingSpeed)*(1-Math.exp(-dt*9));const nextX=clamp(player.x-Math.sin(player.yaw)*walkingSpeed*dt*9,-120,120),nextZ=clamp(player.z-Math.cos(player.yaw)*walkingSpeed*dt*9,-120,120);if(!blocked(nextX,player.z))player.x=nextX;if(!blocked(player.x,nextZ))player.z=nextZ;avatar.g.position.x=player.x;avatar.g.position.z=player.z;avatar.g.rotation.y=player.yaw;animatePerson(avatar,clock.elapsedTime,Math.abs(walkingSpeed));for(const p of people){let time=clock.elapsedTime*.15+p.phase;p.g.position.x=p.x+Math.sin(time)*3;p.g.position.z=p.z+Math.cos(time)*3;p.g.rotation.y=-time;animatePerson(p,clock.elapsedTime,.45)}if(selectedNpc&&clock.elapsedTime<waveUntil){selectedNpc.limbs[1].rotation.z=-2.35;selectedNpc.limbs[1].rotation.x=Math.sin(clock.elapsedTime*13)*.2}if(selectedNpc&&Math.hypot(player.x-selectedNpc.g.position.x,player.z-selectedNpc.g.position.z)>12)closeNpc();for(let i=0;i<ripples.length;i++)ripples[i].material.opacity=.18+.16*Math.sin(clock.elapsedTime*.8+i);for(const cloud of clouds)cloud.position.x+=dt*.22;const a=player.yaw+orbit;let cx,cy,cz;if(mode===2){cx=player.x;cy=3.5;cz=player.z;aim.set(player.x-Math.sin(a)*10,3.5+Math.sin(pitch)*7,player.z-Math.cos(a)*10)}else{let r=mode===1?dist*1.4:dist;cx=player.x+Math.sin(a)*r;cy=3.5+Math.sin(pitch)*r;cz=player.z+Math.cos(a)*r;aim.set(player.x,2.2,player.z)}const ease=1-Math.exp(-dt*7);camera.position.lerp(new T.Vector3(cx,cy,cz),ease);camera.lookAt(aim);avatar.g.visible=mode!==2;for(let i=0;i<places.length;i++){if(Math.hypot(player.x-places[i][1],player.z-places[i][2])<12&&target!==i){target=i;showPlace(i);break}}renderer.render(scene,camera)}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});showPlace(2);
}
