<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>UNIFY Classroom 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Paper-cut HUD: kraft tags with a hard lower edge and a soft cast shadow, over a cream sheet. */
:root{--sheet:#EADFCB;--kraft:#F3E7CF;--kraft-edge:#C9B28A;--ink:#4A3B3F;--soft:#8A7A70;--acc:#E07A66;--gold:#EAB94E;--blue:#4F91C7;
 --ui:"Fredoka","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--sheet);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:absolute;inset:0}
#game canvas{display:block;width:100%;height:100%}
#paper,#tint,#vig{position:absolute;inset:0;pointer-events:none}
#paper{mix-blend-mode:multiply;opacity:.6;background-size:256px 256px;z-index:20}
#tint{mix-blend-mode:multiply;z-index:21}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(96,58,52,.28) 100%);z-index:22}
.hud{position:absolute;z-index:30;display:flex;gap:8px;flex-wrap:wrap;align-items:center;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px))}
.tag{background:var(--kraft);border-radius:12px;padding:6px 12px;font-size:14px;box-shadow:0 2px 0 var(--kraft-edge),0 6px 10px rgba(80,50,40,.28);border:1px solid rgba(255,255,255,.7)}
.tag b{font-weight:600}
.tag .bar{display:inline-block;vertical-align:middle;margin-left:8px;width:84px;height:7px;border-radius:4px;background:rgba(74,59,63,.16);overflow:hidden}
.tag .bar i{display:block;height:100%;width:0;background:var(--acc)}
button.tag{font:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-height:36px}
button.tag:active{transform:translateY(2px);box-shadow:0 0 0 var(--kraft-edge),0 3px 6px rgba(80,50,40,.28)}
button.tag:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hint{position:absolute;z-index:30;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:13px}
.rot{position:absolute;z-index:30;left:10px;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.rot button{width:48px;height:44px;font-size:22px;padding:0;touch-action:none}
#goMenu{position:absolute;z-index:32;left:10px;top:calc(56px + env(safe-area-inset-top,0px));display:none;flex-direction:column;gap:6px;padding:10px;min-width:210px}
#goMenu.show{display:flex}
#goMenu h4{font-weight:600;font-size:13px;color:var(--soft);margin:0 2px 2px}
#goMenu button{font:inherit;font-size:15px;text-align:left;color:var(--ink);background:#FFF9F0;border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 2px 0 var(--kraft-edge)}
#goMenu button:active{transform:translateY(2px);box-shadow:none}
#goMenu button i{width:14px;height:14px;border-radius:5px;border:2px solid rgba(74,59,63,.5);display:inline-block}
#talkChip{position:absolute;z-index:33;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;background:var(--acc);color:#fff;border-color:rgba(255,255,255,.7);box-shadow:0 2px 0 #b95a48,0 6px 10px rgba(80,50,40,.28)}
#talkChip.show{display:block}
#toast{position:absolute;z-index:31;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;max-width:90%;text-align:center}
#toast.show{display:block}
.pad{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:180px;height:180px;z-index:30;touch-action:none;display:none}
@media(max-width:700px){#cnt,#bDbg,#bFriends{display:none}.tag{padding:4px 10px;font-size:13px}button.tag{min-height:32px}}
@media (pointer:coarse){.pad{display:block}.hint{display:none}.rot{bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
.pad button{position:absolute;width:56px;height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.7);background:var(--kraft);box-shadow:0 2px 0 var(--kraft-edge),0 5px 8px rgba(80,50,40,.3);color:var(--ink);font-size:20px;touch-action:none}

#cap{position:absolute;z-index:31;left:50%;bottom:calc(58px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,92%);display:none;text-align:left;padding:10px 16px;font-size:17px;line-height:1.35;pointer-events:none}
#cap.show{display:block}#cap b{color:var(--acc);margin-right:6px}
#steps{position:absolute;z-index:30;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:13px;pointer-events:none}
#views{position:absolute;z-index:30;right:10px;top:calc(56px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
#views button.on,#lessonSel:focus{background:var(--gold)}
#lessonSel{font:inherit;font-size:14px;color:var(--ink);border:1px solid rgba(255,255,255,.7);min-height:36px}
#tip{position:absolute;z-index:34;display:none;pointer-events:none;font-size:13px;padding:4px 10px}
.dimmed #vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(10,14,30,.55) 100%)}
#labHost{position:absolute;inset:0;z-index:40;display:none}#labHost.show{display:block}
</style>
</head>
<body>
<div id="game"></div>
<div id="paper"></div><div id="tint"></div><div id="vig"></div>
<div class="hud">
  <span class="tag"><b id="subj">Class</b> &middot; <span id="ltitle">-</span></span>
  <select class="tag" id="lessonSel" aria-label="Lesson"></select>
  <button class="tag" id="bHand">Raise hand (H)</button>
  <button class="tag" id="bSkip">Next step</button>
  <button class="tag" id="bLab">Try the 3D example</button>
  <button class="tag" id="bFriends">Friends</button>
  <button class="tag" id="bAvatar">Avatar</button>
</div>
<div class="tag" id="steps"></div>
<div id="views">
  <button class="tag" data-cam="auto">Auto director</button><button class="tag" data-cam="wide">Wide</button><button class="tag" data-cam="follow">Follow teacher</button>
  <button class="tag" data-cam="board-left">Left board</button><button class="tag" data-cam="board-right">Right board</button><button class="tag" data-cam="screen">Projector</button>
  <button class="tag" data-cam="demo">3D example</button><button class="tag" data-cam="seat">My seat</button><button class="tag" data-cam="free">Free orbit</button>
</div>
<div class="tag" id="cap"></div><div class="tag" id="tip"></div>
<div id="labHost"></div>
<script src="demo/dist/classroom3d.js"></script>
</body>
</html>
