<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamouline | Interactive 3D Rooms</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edf1;font:15px system-ui;color:#213448}canvas{display:block}header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;flex-wrap:wrap}button,a{font:inherit;padding:9px 12px;border:1px solid #a9b6c3;border-radius:9px;background:#fff;color:#16445c;cursor:pointer}button[aria-pressed=true]{background:#205d79;color:white}#scene{height:66vh;min-height:330px}main{padding:12px;max-width:1000px;margin:auto}.panel{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0001}#status{min-height:24px}#question{width:100%;min-height:65px;padding:10px;border:1px solid #abc;border-radius:8px}#queue{padding-left:20px}small{color:#53687a}@media(max-width:650px){#scene{height:55vh;min-height:300px}header{gap:5px}button,a{padding:8px}}</style></head><body><header><strong>Hamouline · Interactive 3D Rooms</strong><a href="/">← World</a><button id="classroom" aria-pressed="true">Classroom</button><button id="auditorium" aria-pressed="false">Auditorium</button><button id="animate">Play lesson</button><button id="next-lesson">Next lesson</button><button id="quality">Shadows: On</button></header><div id="scene" aria-label="Interactive 3D classroom and auditorium"></div><main><div class="panel"><strong id="title">Classroom · Live demonstration</strong><p id="status" aria-live="polite">Drag to orbit 360°. Tap a character to select them. Raise your hand to practice a question.</p><button id="hand">✋ Raise hand</button><button id="sit">Sit / Stand</button><button id="talk">🔊 Teacher speaks</button><p><small>This is an interactive local demonstration. It is not a connected live class, and no teacher receives questions.</small></p><textarea id="question" maxlength="500" placeholder="Ask a question about the lesson" aria-label="Question"></textarea><button id="submit">Add to practice question queue</button><button id="clear-queue">Clear questions</button><ol id="queue"></ol></div></main><script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script><script>
if(!window.THREE){document.getElementById('status').textContent='3D renderer unavailable. Please check your connection.'}else{
const T=THREE,container=document.getElementById('scene'),scene=new T.Scene();scene.background=new T.Color('#c8d9e8');

const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;container.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight('#e8f4ff','#8a8177',1.6));const sun=new T.DirectionalLight('#fff4df',2.5);sun.position.set(-7,17,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-23;sun.shadow.camera.right=23;sun.shadow.camera.top=23;sun.shadow.camera.bottom=-23;scene.add(sun);
const mat=(c,r=.7)=>new T.MeshStandardMaterial({color:c,roughness:r}),wood=mat('#b48b68'),floor=mat('#e6d7c1'),wall=mat('#f3ede2'),dark=mat('#344b61'),metal=mat('#7c8d96'),skin=[mat('#b77e5e'),mat('#dfad89'),mat('#835442'),mat('#c89978')],shirts=[mat('#477baf'),mat('#a9617d'),mat('#4c987b'),mat('#bf9752')];
let room=new T.Group();scene.add(room),people=[],selected=null,playing=false,sitting=false,mode='classroom',time=0,orbit=.6,pitch=.43,zoom=21,board=null,lessonIndex=0;const lessons=[{title:'Mathematics · Ratios',body:'Ratio = comparison of two quantities. Example: 2 apples : 3 pears.'},{title:'Mathematics · Equivalent Ratios',body:'Multiply both parts by the same number. 2:3 = 4:6.'},{title:'Mathematics · Unit Rates',body:'A unit rate compares a quantity to one unit. 60 miles in 2 hours = 30 miles per hour.'},{title:'Science · Observation',body:'Observe, ask a question, form a testable hypothesis, and record evidence.'}];
function box(parent,w,h,d,m,x,y,z){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}

const npcPalette={hair:['#30252a','#4b3029','#211d26','#704d31','#483c32'],shoe:['#f4e8df','#d9dce5','#333a4a'],accent:['#d78fa8','#e2b76c','#8ab7ca','#b99bdb']};
const skinM=skin,eyeWhite=mat('#fff8ed'),eyeDark=mat('#28252c'),lip=mat('#9e6267');

function npc(x,z,id,teacher=false){
 const g=new T.Group();g.position.set(x,0,z);room.add(g);const shade=skinM[id%4],outfit=shirts[(id+(teacher?1:0))%4],hair=mat(npcPalette.hair[id%5]),accent=mat(npcPalette.accent[id%4]),shoes=mat(npcPalette.shoe[id%3]);

 else if(id%3===1){const cap=new T.Mesh(new T.SphereGeometry(.48,16,10,0,Math.PI*2,0,Math.PI*.53),hair);cap.position.y=.13;head.add(cap);for(let i=0;i<5;i++)capsule(head,.11,.42,hair,-.33+i*.17,-.22,.29)}
 else{const cap=new T.Mesh(new T.SphereGeometry(.49,16,10,0,Math.PI*2,0,Math.PI*.55),hair);cap.position.y=.14;head.add(cap)}

  const shoulder=new T.Group();shoulder.position.set(side*.48,.36,0);torso.add(shoulder);
  capsule(shoulder,.145,.43,outfit,0,-.32,0);
  const elbow=new T.Group();elbow.position.y=-.65;shoulder.add(elbow);capsule(elbow,.115,.36,shade,0,-.27,0);sphere(elbow,.14,shade,0,-.54,0);arms.push(shoulder);elbows.push(elbow);
  const hip=new T.Group();hip.position.set(side*.24,1.50,0);g.add(hip);capsule(hip,.21,.54,dark,0,-.39,0);
  const knee=new T.Group();knee.position.y=-.74;hip.add(knee);capsule(knee,.16,.42,dark,0,-.32,0);box(knee,.38,.2,.61,shoes,0,-.64,-.13);legs.push(hip);knees.push(knee);
 }
 if(id%4===1){const band=new T.Mesh(new T.TorusGeometry(.50,.065,7,20,Math.PI),accent);band.rotation.z=Math.PI/2;band.position.y=.09;head.add(band);for(const side of [-1,1]){const cup=new T.Mesh(new T.CylinderGeometry(.18,.18,.12,12),accent);cup.rotation.z=Math.PI/2;cup.position.set(side*.52,.03,0);head.add(cup)}}
 if(!teacher&&id%3===0){box(torso,.66,.78,.27,accent,0,-.04,.43);for(const side of [-1,1])box(torso,.09,.8,.1,accent,side*.33,.02,.26)}
 if(teacher){box(torso,.65,.16,.05,accent,0,.06,-.42);box(torso,.1,.14,.04,eyeWhite,0,.06,-.46)}
 g.userData.id=id;g.userData.teacher=teacher;
 const record={g,torso,head,arms,legs,elbows,knees,id,teacher};people.push(record);return g
}
function build(which){mode=which;room.clear();people=[];selected=null;board=null;const stage=which==='auditorium';box(room,25,.4,19,floor,0,-.2,0);box(room,25,9,.35,wall,0,4.4,-9.3);box(room,.35,9,19,wall,-12.4,4.4,0);box(room,.35,9,19,wall,12.4,4.4,0);for(let i=0;i<7;i++)box(room,.08,9,.12,wood,-10+i*3.3,4.5,-9.04);
if(stage){box(room,21,1.3,7,wood,0,.65,-5.5);box(room,21,8,.45,dark,0,5,-9.05);for(const side of [-1,1]){box(room,2.2,7,.5,mat('#7c3453'),side*10,4,-7);box(room,.3,6,.3,metal,side*8.4,4,-6)}for(let i=0;i<6;i++){const x=(i-2.5)*2.6;const g=npc(x,-5.6,i,i===0);g.position.y=1.35}for(let r=0;r<3;r++)for(let c=0;c<7;c++){const x=(c-3)*2.6,z=1+r*2.4;box(room,1.6,.3,1.1,dark,x,.8,z);box(room,1.7,1.3,.25,mat('#b15d61'),x,1.5,z+.48)}}
else{board=box(room,9,3.8,.22,mat('#38675b'),0,5,-9.0);box(room,10,.15,.5,wood,0,2.9,-8.8);box(room,4,.25,1.6,wood,-3,1.35,-6.5);for(let r=0;r<3;r++)for(let c=0;c<4;c++){const x=(c-1.5)*4,z=-3+r*3.5;box(room,2.5,.16,1.1,wood,x,1.45,z);for(const side of [-1,1])box(room,.14,1.4,.14,metal,x+side*1, .72,z);box(room,1.3,.2,1.2,dark,x,.65,z+1);box(room,1.3,1,.18,dark,x,1.1,z+1.55);const g=npc(x,z+1.05,r*4+c);g.rotation.y=0}npc(-3,-6.3,13,true);for(let i=0;i<5;i++)box(room,1.7,.12,1.1,mat('#e8e1cc'),-7+i*3.5,.06,7)}
document.getElementById('title').textContent=stage?'Auditorium · Rehearsal':'Classroom · Live demonstration';document.getElementById('classroom').setAttribute('aria-pressed',String(!stage));document.getElementById('auditorium').setAttribute('aria-pressed',String(stage));document.getElementById('status').textContent=stage?'Auditorium rehearsal loaded. Play to see performers gesture.':'Classroom loaded. Select a student or teacher, then play the lesson.'}
function updateBoard(){if(!board)return;const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=440;const ctx=canvas.getContext('2d');ctx.fillStyle='#245448';ctx.fillRect(0,0,1024,440);ctx.fillStyle='#fff4d2';ctx.font='bold 52px system-ui';ctx.fillText(lessons[lessonIndex].title,38,90);ctx.font='31px system-ui';const words=lessons[lessonIndex].body.split(' ');let line='',y=170;for(const word of words){const test=line+word+' ';if(ctx.measureText(test).width>935){ctx.fillText(line,38,y);line=word+' ';y+=55}else line=test}ctx.fillText(line,38,y);const texture=new T.CanvasTexture(canvas);texture.colorSpace=T.SRGBColorSpace;if(board.userData.lessonTexture)board.userData.lessonTexture.dispose();board.userData.lessonTexture=texture;board.material= new T.MeshBasicMaterial({map:texture});document.getElementById('status').textContent='Lesson '+(lessonIndex+1)+' of '+lessons.length+': '+lessons[lessonIndex].title+' (demonstration content).'}
const originalBuild=build;build=function(which){originalBuild(which);updateBoard()};
build('classroom');document.getElementById('classroom').onclick=()=>build('classroom');document.getElementById('auditorium').onclick=()=>build('auditorium');
document.getElementById('next-lesson').onclick=()=>{lessonIndex=(lessonIndex+1)%lessons.length;updateBoard()};
document.getElementById('animate').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause animation':'Play lesson'};
document.getElementById('quality').onclick=e=>{renderer.shadowMap.enabled=!renderer.shadowMap.enabled;e.target.textContent='Shadows: '+(renderer.shadowMap.enabled?'On':'Off');room.traverse(o=>{if(o.isMesh)o.material.needsUpdate=true})};
document.getElementById('hand').onclick=()=>{selected=people.find(p=>!p.teacher)||null;if(selected){selected.g.userData.handUntil=time+4;document.getElementById('status').textContent='Hand raised. Type your question below.'}};
document.getElementById('sit').onclick=()=>{sitting=!sitting;document.getElementById('status').textContent=sitting?'Students are sitting.':'Students are standing.'};
const queueKey='hamouline-room-practice-questions';let questions=[];try{questions=JSON.parse(localStorage.getItem(queueKey)||'[]');if(!Array.isArray(questions))questions=[]}catch(e){questions=[]}
function renderQuestions(){const list=document.getElementById('queue');list.replaceChildren();questions.forEach((q,i)=>{const li=document.createElement('li');li.textContent=q+' ';const done=document.createElement('button');done.textContent='Mark answered';done.onclick=()=>{questions.splice(i,1);saveQuestions()};li.append(done);list.append(li)})}
function saveQuestions(){try{localStorage.setItem(queueKey,JSON.stringify(questions))}catch(e){}renderQuestions()}
renderQuestions();
document.getElementById('submit').onclick=()=>{const q=document.getElementById('question'),v=q.value.trim();if(!v)return;questions.push(v);saveQuestions();q.value='';document.getElementById('status').textContent='Question saved on this device (not sent to a teacher).'};
document.getElementById('clear-queue').onclick=()=>{questions=[];saveQuestions()};
document.getElementById('talk').onclick=()=>{if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(mode==='classroom'?'Welcome to class. Raise your hand when you have a question.':'Welcome to our auditorium. Today we are rehearsing our performance.');u.rate=.94;speechSynthesis.speak(u)};
let drag=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-lastX,e.clientY-lastY)<5){const rect=renderer.domElement.getBoundingClientRect(),mouse=new T.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),ray=new T.Raycaster();ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(people.map(p=>p.g),true);if(hits.length){let o=hits[0].object;while(o.parent&&o.userData.id===undefined&&o!==room)o=o.parent;selected=people.find(p=>p.g===o)||null;if(selected)document.getElementById('status').textContent=(selected.teacher?'Teacher':'Student')+' selected.'}}drag=false});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;orbit-=(e.clientX-lastX)*.008;pitch=Math.max(.1,Math.min(1.1,pitch+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(10,Math.min(35,zoom+Math.sign(e.deltaY)*2))},{passive:true});
function resize(){const w=container.clientWidth,h=container.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}addEventListener('resize',resize);resize();let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;for(const p of people){const active=playing,raised=p.g.userData.handUntil>time;p.arms[0].rotation.z=active&&p.teacher?Math.sin(time*2)*.26:0;p.arms[1].rotation.z=raised?-2.4:active&&(p.teacher||mode==='auditorium')?-1.2+Math.sin(time*3+p.id)*.35:0;p.elbows[0].rotation.x=active?Math.sin(time*2+p.id)*.25:0;p.elbows[1].rotation.x=raised?-.35:active?Math.sin(time*2+p.id+1)*.3:0;p.legs[0].rotation.x=sitting&&!p.teacher?-1.18:0;p.legs[1].rotation.x=sitting&&!p.teacher?-1.18:0;p.knees[0].rotation.x=sitting&&!p.teacher?1.2:0;p.knees[1].rotation.x=sitting&&!p.teacher?1.2:0;p.head.rotation.y=Math.sin(time*.8+p.id)*.09;p.head.rotation.z=Math.sin(time*1.3+p.id)*.025;p.torso.rotation.z=active?Math.sin(time*1.7+p.id)*.025:0;p.g.position.y=sitting&&!p.teacher?-.38:mode==='auditorium'&&active?Math.sin(time*2+p.id)*.12:0;p.g.rotation.y=mode==='auditorium'&&active?Math.sin(time*.8+p.id)*.12:0}camera.position.set(Math.sin(orbit)*zoom,5+Math.sin(pitch)*zoom*.52,Math.cos(orbit)*zoom);camera.lookAt(0,2,0);renderer.render(scene,camera)}requestAnimationFrame(frame);
}
