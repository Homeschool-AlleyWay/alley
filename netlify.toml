# Dedicated static site for Mommy's Secret Pantry.
# This change is limited to the mommys-secret-pantry-netlify branch.
# Main Homoleen campus branches keep their original build settings.
[build]
  command = "echo 'Publishing standalone Mommy Secret Pantry cookbook'"
  publish = "mommys-secret-pantry"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
