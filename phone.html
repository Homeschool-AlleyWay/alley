<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>UNIFY Flip Phone</title>
<meta name="theme-color" content="#E07A66"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Flip Phone"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="phone.webmanifest"><link rel="icon" href="phone-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="phone-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
/* UNIFY Flip Phone: a 2D clamshell that opens two ways (flip-up or side-swivel). Same paper-cut palette as the rest of the academy. */
:root{--sheet:#EADFCB;--kraft:#F3E7CF;--edge:#C9B28A;--ink:#4A3B3F;--soft:#8A7A70;--acc:#E07A66;--acc2:#b95a48;--blue:#4F91C7;--lcd:#EEF2E2;--lcd2:#DDE5CC;--ok:#6BAF7B;
 --ui:"Fredoka","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font:14px/1.3 var(--ui);color:var(--ink);background:var(--sheet)}
body.embedded{background:transparent}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fit{transform-origin:50% 50%;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;margin-bottom:60px}
.dev{position:relative;perspective:1600px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.5,0,.2,1)}
.dev.up{width:320px;height:670px}.dev.side{width:650px;height:340px}
.dev.up.closed{transform:translateY(-167px)}.dev.side.closed{transform:translateX(-162px)}
.lid,.base{position:absolute;width:320px;height:330px;border-radius:26px}
.base{background:linear-gradient(#e98a76,#d96d58);box-shadow:0 3px 0 var(--acc2),0 14px 24px rgba(80,50,40,.35);border:2px solid rgba(255,255,255,.55);padding:10px 14px}
.dev.up .base{left:0;top:340px}.dev.side .base{left:330px;top:0}
.lid{left:0;top:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.5,0,.2,1)}
.dev.up .lid{transform-origin:50% 335px;transform:translateZ(0) rotateX(0)}.dev.up.closed .lid{transform:translateZ(6px) rotateX(-180deg)}
.dev.side .lid{transform-origin:325px 50%;transform:translateZ(0) rotateY(0)}.dev.side.closed .lid{transform:translateZ(6px) rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.inner{background:linear-gradient(#e98a76,#d96d58);box-shadow:0 3px 0 var(--acc2),0 14px 24px rgba(80,50,40,.35);border:2px solid rgba(255,255,255,.55);padding:14px}
.outer{background:linear-gradient(#5aa0d4,#4381b3);box-shadow:0 3px 0 #2f6190,0 14px 24px rgba(40,60,90,.4);border:2px solid rgba(255,255,255,.55);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center}
.dev.up .outer{transform:rotateX(180deg)}.dev.side .outer{transform:rotateY(180deg)}
.hinge{position:absolute;z-index:5;background:linear-gradient(90deg,#9c4f40,#cf7a67,#9c4f40);border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.dev.up .hinge{left:60px;width:200px;top:326px;height:18px}.dev.side .hinge{top:60px;height:200px;left:316px;width:18px;background:linear-gradient(#9c4f40,#cf7a67,#9c4f40)}
.dev.closed .hinge{opacity:.0}
/* cover */
.cover-time{font-size:46px;font-weight:600;line-height:1}.cover-date{opacity:.9}.cover-next{font-size:13px;background:rgba(255,255,255,.2);border-radius:12px;padding:5px 10px}
.cover-badge{background:var(--acc);border-radius:99px;padding:3px 10px;font-size:13px}.cover-alert{background:#fff;color:var(--acc2);border-radius:12px;padding:6px 10px;font-weight:600;max-width:260px}
.cover-btns{display:flex;gap:8px;margin-top:4px}
.pill,.tool{font:inherit;color:var(--ink);background:var(--kraft);border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:5px 14px;min-height:34px;cursor:pointer;box-shadow:0 2px 0 var(--edge),0 6px 10px rgba(80,50,40,.28)}
.pill:active,.tool:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge),0 3px 6px rgba(80,50,40,.28)}
.pill:focus-visible,.tool:focus-visible,.key:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tool.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{display:flex;gap:8px;position:fixed;bottom:12px;left:0;right:0;flex-wrap:wrap;justify-content:center;z-index:6}
/* screen */
.screen{width:100%;height:100%;border-radius:14px;background:var(--lcd);border:3px solid #3b2f33;box-shadow:inset 0 0 14px rgba(60,80,40,.35);display:flex;flex-direction:column;overflow:hidden;position:relative}
.sb{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:3px 8px;background:var(--lcd2);border-bottom:1px solid rgba(0,0,0,.12);flex:none}
.hd{display:flex;align-items:center;gap:6px;padding:5px 9px;font-weight:600;font-size:14px;background:var(--blue);color:#fff;flex:none}
.hd small{margin-left:auto;font-weight:400;opacity:.85;font-size:11px}
.bd{flex:1;overflow:auto;padding:6px;min-height:0}
.bd::-webkit-scrollbar{width:4px}.bd::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}
.fx{outline:3px solid var(--acc);outline-offset:-1px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.app{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;background:var(--kraft);border-radius:12px;box-shadow:0 2px 0 var(--edge);cursor:pointer;font-size:12px;position:relative}
.app b{font-size:25px;line-height:1;font-weight:400}.app i{position:absolute;top:2px;right:6px;background:var(--acc);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:0 5px}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fff9;border-radius:9px;margin-bottom:4px;cursor:pointer}
.row .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;font-size:13px}
.row .tx{flex:1;min-width:0}.row .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .tx small{color:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
.grp{font-size:11px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;margin:6px 2px 3px}
.chat{display:flex;flex-direction:column;gap:4px;padding-bottom:4px}
.bub{max-width:82%;padding:5px 9px;border-radius:12px;background:#fff;box-shadow:0 1px 0 var(--edge);word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff}.bub small{display:block;font-size:10px;opacity:.7}
.typing{color:var(--soft);font-size:12px;padding-left:4px}
.inp{display:flex;gap:4px;padding:4px;background:var(--lcd2);flex:none;border-top:1px solid rgba(0,0,0,.12)}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--edge);border-radius:8px;padding:5px 7px;min-width:0}
input:focus,select:focus{outline:2px solid var(--blue)}
.inp input{flex:1}.btn{font:inherit;border:0;border-radius:9px;padding:5px 10px;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 2px 0 var(--acc2)}
.btn.alt{background:var(--blue);box-shadow:0 2px 0 #356c9c}.btn.gh{background:var(--kraft);color:var(--ink);box-shadow:0 2px 0 var(--edge)}.btn:active{transform:translateY(2px);box-shadow:none}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.chip{font-size:12px;background:var(--kraft);border-radius:99px;padding:3px 9px;cursor:pointer;box-shadow:0 1px 0 var(--edge)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal .dn{color:var(--soft);font-size:10px}.cal .d{padding:5px 0;border-radius:7px;background:#fff8;cursor:pointer;position:relative}
.cal .d.off{opacity:.3}.cal .d.today{background:var(--acc);color:#fff}.cal .d.sel{box-shadow:inset 0 0 0 2px var(--blue)}.cal .d.ev:after{content:"";position:absolute;bottom:1px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--blue)}
.cal .d.today.ev:after{background:#fff}
.sheet{border-collapse:collapse;font-size:12px;width:100%}.sheet td,.sheet th{border:1px solid var(--edge);padding:4px 5px;background:#fff;white-space:nowrap;cursor:pointer}.sheet th{background:var(--kraft);font-weight:600}.sheet td.sel{background:#ffe6a8}
.now{background:var(--acc)!important;color:#fff}.now small{color:#fff!important}
.kv{display:flex;flex-direction:column;gap:6px}.kv label{font-size:11px;color:var(--soft);display:flex;flex-direction:column;gap:2px}
.def h4{margin:6px 0 2px;color:var(--acc2)}.def p{margin:2px 0 2px 6px}.def em{color:var(--soft)}
.calc-d{background:#2b3a2e;color:#b9f2c0;font:600 26px/1 "Courier New",monospace;text-align:right;padding:10px 8px;border-radius:8px;margin-bottom:6px;overflow:hidden;white-space:nowrap}
.calc-d small{display:block;font-size:11px;min-height:12px;color:#7fb98a}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.cg button{font:600 16px var(--ui);padding:7px 0;border:0;border-radius:8px;background:var(--kraft);box-shadow:0 2px 0 var(--edge);color:var(--ink);cursor:pointer}
.cg button.o{background:var(--blue);color:#fff;box-shadow:0 2px 0 #356c9c}.cg button.e{background:var(--acc);color:#fff;box-shadow:0 2px 0 var(--acc2)}
.muted{color:var(--soft);font-size:12px}.err{color:#b23a2c;font-size:12px}.ok{color:#2f7a48;font-size:12px}
.chk{width:18px;height:18px;border:2px solid var(--blue);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}.chk.on{background:var(--blue)}
.toast{position:absolute;left:8px;right:8px;top:24px;background:#3b2f33;color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;z-index:9;box-shadow:0 4px 10px rgba(0,0,0,.3);animation:tin .25s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
/* keypad */
.kp{display:flex;flex-direction:column;gap:6px;height:100%}
.soft{display:flex;justify-content:space-between}.key{font:inherit;color:var(--ink);background:var(--kraft);border:1px solid rgba(255,255,255,.7);border-radius:12px;min-height:34px;cursor:pointer;box-shadow:0 3px 0 var(--edge),0 5px 8px rgba(80,50,40,.25);user-select:none}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}.soft .key{width:104px;font-size:13px}
.mid{display:flex;align-items:center;justify-content:space-between}.mid .key.cr{width:70px;height:40px;font-weight:600;color:#fff}
.dpad{position:relative;width:104px;height:104px;border-radius:50%;background:var(--kraft);box-shadow:0 3px 0 var(--edge),0 6px 10px rgba(80,50,40,.3);border:1px solid #fff9}
.dpad .key{position:absolute;width:36px;height:30px;min-height:0;box-shadow:none;background:transparent;border:0;font-size:15px}.dpad .u{left:34px;top:3px}.dpad .d{left:34px;bottom:3px}.dpad .l{left:3px;top:37px}.dpad .r{right:3px;top:37px}
.dpad .ok{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;border:2px solid #fff9;font-weight:600;font-size:12px;box-shadow:0 2px 0 var(--acc2);cursor:pointer;font-family:inherit}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1}.nums .key{font-size:16px;font-weight:500;line-height:1.05}.nums .key small{display:block;font-size:8px;color:var(--soft)}
.grill{height:5px;margin:0 auto 4px;width:60px;border-radius:3px;background:rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="stage" id="stage">
 <div class="fit" id="fit">
  <div class="dev up closed" id="dev">
   <div class="lid" id="lid">
    <div class="face inner"><div class="screen" id="screen"></div></div>
    <div class="face outer" id="cover"></div>
   </div>
   <div class="hinge"></div>
   <div class="base"><div class="kp">
     <div class="grill"></div>
     <div class="soft"><button class="key" id="kBack" title="Back (Backspace)">◀ Back</button><button class="key" id="kMenu" title="Home (Esc)">Home ▣</button></div>
     <div class="mid">
       <button class="key cr" style="background:var(--ok)" id="kCall" title="Open Messages">📞</button>
       <div class="dpad"><button class="key u" data-d="up">▲</button><button class="key d" data-d="down">▼</button><button class="key l" data-d="left">◀</button><button class="key r" data-d="right">▶</button><button class="ok" id="kOk">OK</button></div>
       <button class="key cr" style="background:#c4463c" id="kEnd" title="End: go home, hold to close">End</button>
     </div>
     <div class="nums" id="nums"></div>
   </div></div>
  </div>
 </div>
 <div class="bar" id="bar">
  <button class="tool" id="bUp">⤴ Flip up</button><button class="tool" id="bSide">⤵ Open sideways</button><button class="tool" id="bClose">Close</button><button class="tool" id="bInstall" hidden>⬇ Install app</button><button class="tool" id="bX" hidden>✕ Put away</button>
 </div>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.getElementById(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const embedded=parent!==window; if(embedded){document.body.classList.add('embedded');$('bX').hidden=false;}
/* ---------------------------------------------------------------- storage + settings */
const LS={get(k,d){try{const v=localStorage.getItem('flip.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('flip.'+k,JSON.stringify(v));}catch(e){}}};
const S=Object.assign({name:'You',gClient:'',sheetId:'',sheetRange:'Sheet1!A1:F10',grade:'6',ghUser:'ayrissacanty',ghToken:'',sound:true,useGameClock:true},LS.get('settings',{}));
const saveS=()=>LS.set('settings',S);
/* ---------------------------------------------------------------- time + school schedule (same bell schedule as the hallway sim) */
let gameMin=null; // minutes since midnight pushed by the game, if any
const nowD=()=>new Date(); const nowMin=()=>S.useGameClock&&gameMin!=null?gameMin:(d=>d.getHours()*60+d.getMinutes())(nowD());
const hm=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return`${h%12||12}:${String(mm).padStart(2,'0')} ${h<12?'AM':'PM'}`;};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const SUBJ=[{k:'math',n:'Math',t:'Ms. Brown',r:'A',c:'#4F91C7',c2:'#EAB94E'},{k:'ela',n:'ELA',t:'Mr. Lee',r:'B',c:'#88B89A',c2:'#F28F7E'},{k:'science',n:'Science',t:'Mr. Carter',r:'C',c:'#5E9C72',c2:'#A9DDF2'},{k:'history',n:'History',t:'Mr. Reed',r:'D',c:'#C98569',c2:'#EAB94E'}];
function schedule(d=nowD()){const w=d.getDay(),a=SUBJ[w%4],b=SUBJ[(w+1)%4],s=7*60+30;
 return[{n:'Morning Arrival',s:s,e:s+30,icon:'🚪'},{n:'Period 1: '+a.n,s:s+30,e:s+90,icon:'📘',sub:`${a.t} · Room ${a.r}`,c:a.c,c2:a.c2},{n:'Lunch',s:s+90,e:s+120,icon:'🍎'},
  {n:'Period 2: '+b.n,s:s+120,e:s+180,icon:'📗',sub:`${b.t} · Room ${b.r}`,c:b.c,c2:b.c2},{n:'Dismissal',s:s+180,e:s+210,icon:'🚌'}];}
function nextUp(){const m=nowMin(),sc=schedule();const cur=sc.find(p=>m>=p.s&&m<p.e);if(cur)return`Now: ${cur.n} (ends ${hm(cur.e)})`;const nx=sc.find(p=>p.s>m);return nx?`Next: ${nx.n} at ${hm(nx.s)}`:'School is out for today';}
/* ---------------------------------------------------------------- audio + toasts */
let ac=null;function beep(f=880,d=.12,n=1){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*(d+.06);o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);}}catch(e){}}
let toastT=0;function toast(m){const sc=$('screen');sc.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;sc.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600);}
/* ---------------------------------------------------------------- device open/close (two ways) */
const dev=$('dev');let mode=LS.get('mode','up'),isOpen=false,busy=false;
function layout(){dev.classList.toggle('up',mode==='up');dev.classList.toggle('side',mode==='side');
 const w=mode==='up'?320:650,h=mode==='up'?670:340,sc=Math.min((innerWidth-24)/w,(innerHeight-130)/h,1.5);$('fit').style.transform=`scale(${sc})`;$('fit').style.height=h+'px';$('fit').style.width=w+'px';}
function openDev(m){if(busy)return;if(isOpen&&m&&m!==mode){closeDev();setTimeout(()=>openDev(m),900);return;}
 if(m&&m!==mode){mode=m;LS.set('mode',mode);layout();void dev.offsetWidth;}
 if(isOpen)return;busy=true;dev.classList.remove('closed');isOpen=true;setTimeout(()=>{busy=false;},850);beep(660,.08);coverUpdate();syncBar();}
function closeDev(){if(!isOpen||busy)return;busy=true;dev.classList.add('closed');isOpen=false;setTimeout(()=>{busy=false;},850);beep(440,.08);coverUpdate();syncBar();}
function syncBar(){$('bUp').classList.toggle('on',isOpen&&mode==='up');$('bSide').classList.toggle('on',isOpen&&mode==='side');}
$('bUp').onclick=()=>openDev('up');$('bSide').onclick=()=>openDev('side');$('bClose').onclick=closeDev;$('bX').onclick=()=>parent.postMessage({type:'phone:close'},'*');
addEventListener('resize',layout);
/* ---------------------------------------------------------------- contacts + chat engine */
const COL=['#E07A66','#4F91C7','#6BAF7B','#8FA382','#E3A93F','#5FB5B0','#C96F8F'];
const BASE_CONTACTS=[
 {id:'mom',n:'Mom',g:'Family',k:'parent',e:'M'},{id:'dad',n:'Dad',g:'Family',k:'parent',e:'D'},{id:'gran',n:'Grandma',g:'Family',k:'parent',e:'G'},
 {id:'t-math',n:'Ms. Brown (Math)',g:'Teachers',k:'teacher',s:'math'},{id:'t-ela',n:'Mr. Lee (ELA)',g:'Teachers',k:'teacher',s:'ela'},{id:'t-sci',n:'Mr. Carter (Science)',g:'Teachers',k:'teacher',s:'science'},{id:'t-his',n:'Mr. Reed (History)',g:'Teachers',k:'teacher',s:'history'},{id:'t-alv',n:'Ms. Alvarez',g:'Teachers',k:'teacher',s:'ela'},
 {id:'class',n:'Class Group (players)',g:'Classmates',k:'group'},
 ...[['maya','Maya Chen','cheerful'],['marcus','Marcus Brooks','sporty'],['priya','Priya Patel','nerdy'],['leo','Leo Okafor','funny'],['amara','Amara Santos','artsy'],['diego','Diego Nguyen','curious'],['sofia','Sofia Kim','shy'],['kenji','Kenji Haddad','dreamy'],['zara','Zara Rivera','bossy'],['eli','Eli Ivanov','kind']].map(a=>({id:'n-'+a[0],n:a[1],g:'Students (NPC)',k:'npc',p:a[2]}))
];
let CONTACTS=BASE_CONTACTS;const cById=id=>CONTACTS.find(c=>c.id===id)||BASE_CONTACTS.find(c=>c.id===id);
/* game data: the real NPC roster, the social memory shared with the hallway and classrooms, and the dialogue engine (+ optional /api/chat model) */
let PD=null;
function buildContacts(){if(!PD)return;const fam=BASE_CONTACTS.filter(c=>c.k==='parent'),grp=BASE_CONTACTS.find(c=>c.k==='group'),SN={math:'Math',ela:'ELA',science:'Science',history:'History'};
 const subjOf=d=>Object.keys(PD.TEACHER_BY_SUBJECT).find(k=>PD.TEACHER_BY_SUBJECT[k]===d)||(d.id===101?'ela':null);
 const teachers=PD.STAFF.map(d=>({id:'s'+d.id,n:d.name+(subjOf(d)?` (${SN[subjOf(d)]})`:''),g:'Teachers',k:'teacher',s:subjOf(d),npc:d,e:d.first[0]}));
 const students=PD.ROSTER.map(d=>({id:'n'+d.id,n:d.name,g:'Students (NPC)',k:'npc',p:d.personality,npc:d,e:d.first[0]}));
 CONTACTS=[...fam,...teachers,grp,...students];}
function loadPD(){if(window.__phoneData){PD=window.__phoneData;buildContacts();return;}const s=document.createElement('script');s.src='demo/dist/phonedata.js';s.onload=()=>{PD=window.__phoneData||null;buildContacts();const t=stack[stack.length-1];if(t&&t.id==='msgs')draw();};s.onerror=()=>{};document.head.appendChild(s);}
const frOf=c=>PD&&c.npc?((PD.Social.peek(c.npc.id)||{}).fr||0):0;
const convos={},opts={};

function openCalc(){let disp='0',acc=null,op=null,fresh=true,expr='';const fmt=n=>{if(!isFinite(n))return'Error';const s=String(parseFloat(n.toPrecision(12)));return s.length>12?n.toExponential(5):s;};

async function watchVideo(l){const box=$('wvbox'),btn=$('wv');if(!box)return;btn.disabled=true;box.innerHTML='<p class="muted">Getting the video maker…</p>';
 try{const NV=await loadVidLib(),st=NV.studio,story={id:l.id||('h'+l.headline.length+l.headline.slice(0,8)),tier:l.tier,headline:l.headline,snippet:l.snippet||l.intro||'',source:l.source||'',place:l.place};
  const off=st.onChange(s=>{if(s.progressOf&&story.id in s.progressOf&&$('wvbox')&&!$('wvbox').querySelector('video'))$('wvbox').innerHTML=`<p class="muted">Making your video… ${Math.round(s.progressOf[story.id]*100)}%</p>`;});
  const blob=await st.ensure(story,{stamp:newsLive&&newsData.editionLabel?`${newsData.editionLabel.toUpperCase()} · ${(newsData.place||'').split(',')[0].toUpperCase()}`:''});off();if(!$('wvbox'))return;
  if(!blob){$('wvbox').innerHTML='<p class="err">Could not make the video on this device.</p>';btn.disabled=false;return;}
  $('wvbox').innerHTML='<video controls autoplay loop playsinline style="height:200px;max-width:100%;border-radius:8px;background:#000"></video> <button class="btn gh" data-f id="wf" style="vertical-align:top">⛶ Full</button>';const v=$('wvbox').querySelector('video');v.src=URL.createObjectURL(blob);$('wf').onclick=()=>fullVideo(v);btn.disabled=false;btn.textContent='🎬 Replay';}
 catch(e){box.innerHTML='<p class="err">The video maker is not available here (offline?).</p>';btn.disabled=false;}}
/* ---- Repos (GitHub) */
let repoCache=LS.get('repos',null);
const ghf=u=>fetch('https://api.github.com'+u,{headers:Object.assign({Accept:'application/vnd.github+json'},S.ghToken?{Authorization:'Bearer '+S.ghToken}:{})}).then(r=>{if(!r.ok)throw new Error('GitHub said '+r.status);return r.json();});
function openRepos(){let status='';const v={id:'repos',title:'Repos',hint:'@'+S.ghUser,
 render:()=>{const l=repoCache||[{name:'alley',description:'UNIFY Academy: hallway, auditoriums, newsroom',language:'TypeScript'},{name:'unisim2',description:'University simulator',language:'TypeScript'},{name:'pixel-school-simulator',description:'Pixel school simulator',language:''},{name:'alleybuilderio',description:'Builder.io app',language:'TypeScript'}];
  return(status?`<p class="${status.startsWith('!')?'err':'muted'}">${esc(status.replace(/^!/,''))}</p>`:'')+l.map(r=>`<div class="row" data-f data-n="${esc(r.name)}"><span style="font-size:18px">📦</span><div class="tx"><div>${esc(r.name)}</div><small>${esc(r.description||'No description')}${r.language?' · '+esc(r.language):''}${r.stargazers_count?' · ★'+r.stargazers_count:''}</small></div></div>`).join('')+`<button class="btn gh" data-f id="rr" style="margin-top:4px">↻ Refresh from GitHub</button>`;},
 bind:bd=>{$('rr').onclick=load;bd.querySelectorAll('.row').forEach(r=>r.onclick=()=>openRepo(r.dataset.n));}};
 async function load(){status='Loading…';draw();try{repoCache=await ghf(`/users/${encodeURIComponent(S.ghUser)}/repos?sort=updated&per_page=20`);LS.set('repos',repoCache);status='';}catch(e){status='!'+e.message+' (showing saved list)';}draw();}
 push(v);if(!repoCache)load();}
function openRepo(n){let d=null,err='';const v={id:'repo',title:n,render:()=>{if(err)return`<p class="err">${esc(err)}</p>`;if(!d)return'<p class="muted">Loading…</p>';
  return`<p class="muted">${esc(d.info.description||'')}</p><p>⭐ ${d.info.stargazers_count||0} · 🍴 ${d.info.forks_count||0} · ❗ ${d.info.open_issues_count||0} open</p><div class="grp">Recent commits</div>`+d.commits.map(c=>`<div class="row" data-f><div class="tx"><div>${esc((c.commit.message||'').split('\n')[0])}</div><small>${esc(c.commit.author?.name||'')} · ${new Date(c.commit.author?.date).toLocaleDateString()}</small></div></div>`).join('')+`<button class="btn gh" data-f id="ro" style="margin-top:4px">Open on GitHub ↗</button>`;},
  bind:()=>{const b=$('ro');if(b)b.onclick=()=>window.open(`https://github.com/${S.ghUser}/${n}`,'_blank','noopener');}};
 push(v);Promise.all([ghf(`/repos/${S.ghUser}/${n}`),ghf(`/repos/${S.ghUser}/${n}/commits?per_page=6`)]).then(([info,commits])=>{d={info,commits};const t=stack[stack.length-1];if(t===v)draw();}).catch(e=>{err='Could not load: '+e.message;const t=stack[stack.length-1];if(t===v)draw();});}
/* ---- Settings */
function openSettings(){push({id:'set',title:'Settings',
 render:()=>`<div class="kv">${[['name','Your name'],['grade','Grade for news (K, 1 to 12)'],['gClient','Google OAuth Client ID'],['sheetId','Google Sheet ID'],['sheetRange','Sheet range (e.g. Sheet1!A1:F10)'],['ghUser','GitHub username'],['ghToken','GitHub token (optional, stays on this device)']].map(([k,l])=>`<label>${l}<input data-f data-k="${k}" value="${esc(S[k])}" ${k==='ghToken'?'type="password"':''} autocomplete="off"></label>`).join('')}
  <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" data-f id="so" ${S.sound?'checked':''}> Sounds</label><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" data-f id="gk" ${S.useGameClock?'checked':''}> Use the game clock when the game sends one</label>
  <button class="btn alt" data-f id="gc">${gOK()?'☁ Google connected':'Connect Google (Calendar + Sheets)'}</button><button class="btn gh" data-f id="cl">Clear chats</button><p class="muted">Google needs an OAuth Client ID (Web) that allows this page's origin. Nothing is sent anywhere until you connect.</p></div>`,
 bind:bd=>{bd.querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{S[i.dataset.k]=i.value.trim();saveS();toast('Saved');});$('so').onchange=e=>{S.sound=e.target.checked;saveS();};$('gk').onchange=e=>{S.useGameClock=e.target.checked;saveS();};
  $('gc').onclick=()=>gconnect(()=>draw());$('cl').onclick=()=>{chats={};unread={};saveChats();coverUpdate();toast('Chats cleared');};}});}
/* ---------------------------------------------------------------- game events -> texts, reminders, calendar */
const evLast={};const cool=(k,ms)=>{const n=Date.now();if(evLast[k]&&n-evLast[k]<ms)return false;evLast[k]=n;return true;};
const tomorrowAt=(h,m)=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(h,m,0,0);return d;};
const teacherFor=s=>CONTACTS.find(c=>c.k==='teacher'&&c.s===s);
function bestFriend(){if(!PD)return null;const f=PD.Social.friends().map(x=>cById('n'+x.id)).filter(Boolean);return f[0]||null;}
function onEvent(m){const SN={math:'Math',ela:'ELA',science:'Science',history:'History'};
 if(m.kind==='period'){
  if(m.pk==='arrive'&&cool('arrive',6*60e3))incoming('dad','Good morning! Have a great day at school. Proud of you. 🌞','Dad');
  else if(m.pk==='lunch'&&cool('lunch',6*60e3)){const f=bestFriend()||(PD&&cById('n'+PD.ROSTER[0].bestFriend))||cById('n-maya');if(f)incoming(f.id,pick(['Lunch time! Want to sit together?','I saved you a seat. Come find me!','Are you hungry too? Race you to the tables!']),f.n);}
  else if(m.pk==='dismiss'&&cool('dismiss',6*60e3))incoming('mom','I will be at the front doors at dismissal. Look for the blue car! 🚗','Mom');}
 else if(m.kind==='homework'&&m.subject){const t=(m.text||(PD&&PD.LESSONS[m.subject]&&PD.LESSONS[m.subject].homework)||'').trim();if(!t||!cool('hw-'+m.subject,3*60e3))return;const c=teacherFor(m.subject)||cById('mom'),sub=SN[m.subject]||'Class',due=tomorrowAt(7,30);
  incoming(c.id,`Homework: ${t} Due tomorrow morning.`,c.n);addReminder(`${sub} homework: ${t}`,due.getTime());addEvent({title:`${sub} homework due`,date:ymd(due),time:'07:30'});toast('📝 Homework saved to Reminders and Calendar');}
 else if(m.kind==='class-out'&&cool('class-out',3*60e3)){const ids=(m.attendees||[]).map(i=>cById('n'+i)).filter(Boolean),c=ids.length?pick(ids):bestFriend();if(c)incoming(c.id,pick(['Good class! Want to study together at lunch?','That lab was fun. Did you get the homework?','Phew, class is over. Walk to the hall with me?']),c.n);}}
/* ---------------------------------------------------------------- host hooks (game / shell) */
addEventListener('message',e=>{const m=e.data;if(!m||typeof m!=='object')return;
 if(m.type==='phone:clock'&&typeof m.minutes==='number'){gameMin=m.minutes;coverUpdate();}
 else if(m.type==='phone:message'&&m.text){const c=CONTACTS.find(c=>c.id===m.contact)||CONTACTS.find(c=>c.n.toLowerCase().startsWith(String(m.from||'').toLowerCase()))||cById('mom');incoming(c.id,String(m.text).slice(0,200),m.from||c.n);}
 else if(m.type==='phone:lesson'&&m.subject){const c=CONTACTS.find(c=>c.s===m.subject&&c.k==='teacher'),n={math:'Math',ela:'ELA',science:'Science',history:'History'}[m.subject];if(c&&!(m.subject==='news'))incoming(c.id,`Welcome to ${n}! Open your notebook and find a seat. Raise your hand if you have a question.`,c.n);}
 else if(m.type==='phone:event')onEvent(m);
 else if(m.type==='phone:open'){layout();openDev(m.mode==='side'?'side':'up');}});
/* ---------------------------------------------------------------- web app: offline shell + install */
if(!embedded&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('phone-sw.js').catch(()=>{});
let installEv=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;if(!embedded)$('bInstall').hidden=false;});
$('bInstall').onclick=async()=>{if(!installEv)return;installEv.prompt();await installEv.userChoice.catch(()=>{});installEv=null;$('bInstall').hidden=true;};
addEventListener('appinstalled',()=>{$('bInstall').hidden=true;});
/* ---------------------------------------------------------------- boot */
layout();coverUpdate();home();syncBar();loadPD();
if(!chats.mom||!chats.mom.length)addMsg('mom',{me:false,t:'Have a great first day! Text me if you need anything. 💛',from:'Mom'}),unread.mom=1,saveChats(),coverUpdate();
setTimeout(()=>fetchNews().then(d=>{if(newsAlerted||!d.stories||!d.stories.length)return;newsAlerted=true;const t=d.stories[0].headline;alertCover('📰 '+t);coverUpdate();}),4000);
window.__flip={openDev,closeDev,home,push,get open(){return isOpen;},get mode(){return mode;}};
if(!embedded)setTimeout(()=>openDev(mode),400);
})();
</script>
